name: Orihost Auto Renew

on:
 # schedule:
 #   - cron: '0 8 * * *' # 每天北京时间下午 16:00 运行（UTC 08:00）
  workflow_dispatch:     # 支持手动触发

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase requests

      - name: Run Auto Renew Script
        env:
          LOGIN_URL: ${{ secrets.LOGIN_URL }}
          API_SERVER_URL: ${{ secrets.API_SERVER_URL }}
          SERVER_PANEL_URL: ${{ secrets.SERVER_PANEL_URL }}
          ORIHOST_EMAIL: ${{ secrets.ORIHOST_EMAIL }}
          ORIHOST_PASSWORD: ${{ secrets.ORIHOST_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python renew_bot.py
